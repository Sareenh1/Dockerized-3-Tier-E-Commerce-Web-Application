services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ecommerce-backend:1.0
    environment:
      DB_USER: ecommerce_user
      DB_HOST: db
      DB_NAME: ecommerce_db
      DB_PASS: ecommerce_pass
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ecommerce-frontend:1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
    external: true
    name: db_postgres-data
